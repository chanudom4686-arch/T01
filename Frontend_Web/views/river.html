<div class="grid-2">
    <!-- Inlet (ลำน้ำขาเข้า) -->
    <div class="sp-card" style="border-top: 4px solid var(--color-primary);">
        <div class="sp-card-header">
            <h3 class="sp-card-title"><i class="fa-solid fa-water"></i> ลำน้ำขาเข้า (Inlet)</h3>
        </div>
        
        <div class="grid-2" style="margin-bottom: 24px;">
            <div style="background: var(--color-canvas-soft); padding: 16px; border-radius: var(--rounded-md);">
                <div class="value-display">
                    <span class="label">ระดับน้ำหน้าบาน</span>
                    <span class="value">2.15 <span class="unit">ม.</span></span>
                    <span style="font-size: 11px; color: var(--color-ink-mute); margin-top: 4px;">เซ็นเซอร์: TL-136</span>
                </div>
            </div>
            <div style="background: var(--color-canvas-soft); padding: 16px; border-radius: var(--rounded-md);">
                <div class="value-display">
                    <span class="label">ระดับน้ำหลังบาน</span>
                    <span class="value">1.80 <span class="unit">ม.</span></span>
                    <span style="font-size: 11px; color: var(--color-ink-mute); margin-top: 4px;">เซ็นเซอร์: TL-136</span>
                </div>
            </div>
        </div>
        
        <div style="border: 1px solid var(--color-hairline); padding: 16px; border-radius: var(--rounded-md);">
            <div class="value-display">
                <span class="label">ระดับการเปิดบานประตู</span>
                <span class="value" style="color: var(--color-primary);">45 <span class="unit">%</span></span>
            </div>
            <!-- Mini progress bar -->
            <div style="width: 100%; height: 8px; background-color: var(--color-hairline-cool); border-radius: var(--rounded-full); margin-top: 12px; overflow: hidden;">
                <div style="width: 45%; height: 100%; background-color: var(--color-primary);"></div>
            </div>
        </div>
    </div>

    <!-- Outlet (ลำน้ำขาออก) -->
    <div class="sp-card" style="border-top: 4px solid #f39c12;">
        <div class="sp-card-header">
            <h3 class="sp-card-title"><i class="fa-solid fa-water"></i> ลำน้ำขาออก (Outlet)</h3>
        </div>
        
        <div class="grid-2" style="margin-bottom: 24px;">
            <div style="background: var(--color-canvas-soft); padding: 16px; border-radius: var(--rounded-md);">
                <div class="value-display">
                    <span class="label">ระดับน้ำหน้าบาน</span>
                    <span class="value">1.20 <span class="unit">ม.</span></span>
                    <span style="font-size: 11px; color: var(--color-ink-mute); margin-top: 4px;">เซ็นเซอร์: TL-136</span>
                </div>
            </div>
            <div style="background: var(--color-canvas-soft); padding: 16px; border-radius: var(--rounded-md);">
                <div class="value-display">
                    <span class="label">ระดับน้ำหลังบาน</span>
                    <span class="value">0.85 <span class="unit">ม.</span></span>
                    <span style="font-size: 11px; color: var(--color-ink-mute); margin-top: 4px;">เซ็นเซอร์: TL-136</span>
                </div>
            </div>
        </div>
        
        <div style="border: 1px solid var(--color-hairline); padding: 16px; border-radius: var(--rounded-md);">
            <div class="value-display">
                <span class="label">ระดับการเปิดบานประตู</span>
                <span class="value" style="color: #f39c12;">10 <span class="unit">%</span></span>
            </div>
            <!-- Mini progress bar -->
            <div style="width: 100%; height: 8px; background-color: var(--color-hairline-cool); border-radius: var(--rounded-full); margin-top: 12px; overflow: hidden;">
                <div style="width: 10%; height: 100%; background-color: #f39c12;"></div>
            </div>
        </div>
    </div>
</div>

<div class="sp-card" style="margin-top: 24px;">
    <div class="sp-card-header">
        <h3 class="sp-card-title">กราฟระดับน้ำเปรียบเทียบ</h3>
    </div>
    <div style="height: 300px; position: relative;">
        <!-- Chart.js Canvas -->
        <canvas id="riverChart"></canvas>
    </div>
</div>
