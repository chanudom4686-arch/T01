<div class="grid-2">
    <!-- Left Column: Values -->
    <div>
        <div class="grid-2">
            <div class="sp-card">
                <div class="value-display">
                    <span class="label">ระดับน้ำคลอง (เซ็นเซอร์นอกบาน)</span>
                    <span class="value">1.25 <span class="unit">ม.</span></span>
                </div>
            </div>
            
            <div class="sp-card">
                <div class="value-display">
                    <span class="label">ระดับน้ำบ่อ (เซ็นเซอร์ในบ่อ)</span>
                    <span class="value">0.80 <span class="unit">ม.</span></span>
                </div>
            </div>
        </div>

        <div class="sp-card">
            <div class="sp-card-header">
                <h3 class="sp-card-title">สถานะบานประตูน้ำ</h3>
            </div>
            <div class="value-display">
                <span class="label">เปิดบานประตูน้ำอยู่ที่</span>
                <span class="value" style="color: var(--color-primary);">45 <span class="unit">%</span></span>
            </div>
            
            <!-- Mini progress bar -->
            <div style="width: 100%; height: 8px; background-color: var(--color-hairline-cool); border-radius: var(--rounded-full); margin-top: 16px; overflow: hidden;">
                <div style="width: 45%; height: 100%; background-color: var(--color-primary);"></div>
            </div>
        </div>
        
        <div class="sp-card" style="background-color: var(--color-canvas-night); color: var(--color-on-dark);">
            <div class="sp-card-header">
                <h3 class="sp-card-title" style="color: var(--color-on-dark);">ควบคุมปั๊มน้ำ</h3>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn btn-primary" style="flex: 1;"><i class="fa-solid fa-power-off"></i> เปิดปั๊ม</button>
                <button class="btn btn-outline" style="flex: 1; border-color: #555; color: #fff;"><i class="fa-solid fa-power-off"></i> ปิดปั๊ม</button>
            </div>
        </div>
    </div>

    <!-- Right Column: Graph -->
    <div class="sp-card" style="display: flex; flex-direction: column;">
        <div class="sp-card-header">
            <h3 class="sp-card-title">กราฟระดับน้ำเปรียบเทียบ</h3>
        </div>
        <div style="flex: 1; min-height: 300px; position: relative;">
            <!-- Chart.js Canvas -->
            <canvas id="riverChart"></canvas>
        </div>
    </div>
</div>
