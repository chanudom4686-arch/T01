<div class="grid-2">
    <!-- Left Column: Values -->
    <div>
        <div class="grid-2">
            <div class="sp-card">
                <div class="value-display">
                    <span class="label"><i class="fa-solid fa-temperature-half"></i> อุณหภูมิ</span>
                    <span class="value">32.5 <span class="unit">°C</span></span>
                </div>
            </div>
            
            <div class="sp-card">
                <div class="value-display">
                    <span class="label"><i class="fa-solid fa-droplet"></i> ความชื้น</span>
                    <span class="value">65.0 <span class="unit">%</span></span>
                </div>
            </div>
            
            <div class="sp-card">
                <div class="value-display">
                    <span class="label"><i class="fa-solid fa-wind"></i> ความเร็วลม</span>
                    <span class="value">12.4 <span class="unit">km/h</span></span>
                </div>
            </div>
            
            <div class="sp-card">
                <div class="value-display">
                    <span class="label"><i class="fa-solid fa-cloud-showers-heavy"></i> ปริมาณน้ำฝน</span>
                    <span class="value">0.0 <span class="unit">mm</span></span>
                </div>
            </div>
        </div>
        
        <div class="sp-card" style="margin-top: 24px; background-color: var(--color-canvas-night); color: var(--color-on-dark);">
            <div class="sp-card-header">
                <h3 class="sp-card-title" style="color: var(--color-on-dark);">ควบคุมอุปกรณ์ (Relays)</h3>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn btn-primary" style="flex: 1;"><i class="fa-solid fa-power-off"></i> เปิดพัดลมระบายอากาศ</button>
                <button class="btn btn-outline" style="flex: 1; border-color: #555; color: #fff;"><i class="fa-solid fa-power-off"></i> ปิดพัดลม</button>
            </div>
        </div>
    </div>

    <!-- Right Column: Graph -->
    <div class="sp-card" style="display: flex; flex-direction: column;">
        <div class="sp-card-header">
            <h3 class="sp-card-title">กราฟอุณหภูมิ 1 ชั่วโมงล่าสุด</h3>
        </div>
        <div style="flex: 1; min-height: 300px; position: relative;">
            <!-- Chart.js Canvas -->
            <canvas id="weatherChart"></canvas>
        </div>
    </div>
</div>
