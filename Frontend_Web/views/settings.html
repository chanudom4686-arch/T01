<div class="sp-card" style="max-width: 600px; margin: 0 auto;">
    <div class="sp-card-header">
        <h3 class="sp-card-title">ตั้งค่าพารามิเตอร์ระบบ (System Settings)</h3>
    </div>
    
    <form>
        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">ความกว้างบานประตูน้ำ (เมตร)</label>
            <input type="number" step="0.01" value="2.50" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-hairline-strong); border-radius: var(--rounded-sm); font-size: 16px;">
            <p style="font-size: 12px; color: var(--color-ink-mute); margin-top: 4px;">ใช้สำหรับคำนวณสูตรสมดุลน้ำ</p>
        </div>
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">ระดับ Zero Gauge (เมตร)</label>
            <input type="number" step="0.01" value="0.50" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-hairline-strong); border-radius: var(--rounded-sm); font-size: 16px;">
        </div>
        
        <div class="grid-2" style="margin-bottom: 24px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">ระยะเซ็นเซอร์บานปิดสนิท (0%)</label>
                <input type="number" step="0.01" value="3.00" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-hairline-strong); border-radius: var(--rounded-sm); font-size: 16px;">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px;">ระยะเซ็นเซอร์บานเปิดสุด (100%)</label>
                <input type="number" step="0.01" value="0.50" style="width: 100%; padding: 8px 12px; border: 1px solid var(--color-hairline-strong); border-radius: var(--rounded-sm); font-size: 16px;">
            </div>
        </div>
        
        <div style="border-top: 1px solid var(--color-hairline-cool); padding-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
            <button type="button" class="btn btn-outline">ยกเลิก</button>
            <button type="button" class="btn btn-primary">บันทึกการตั้งค่า</button>
        </div>
    </form>
</div>
